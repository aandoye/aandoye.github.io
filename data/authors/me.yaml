bio: |
  Abdoul Aziz Ndoye is an Associate Professor (Maître de Conférences) in Economics
  at the University of Orléans, member of the Laboratoire d'Économie d'Orléans (LEO).
  He holds a PhD in Econometrics from the Aix-Marseille School of Economics (AMSE, 2013).
  His research focuses on econometrics of inequality, quantile and expectile
  regressions, Bayesian econometrics, and statistical machine learning, with
  applications to income distribution and labor markets. His work has been
  presented at several World Congresses of the Econometric Society, most
  recently in Seoul, South Korea (2025).

